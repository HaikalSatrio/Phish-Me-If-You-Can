name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Go (live collectors and model evaluation stay opt-in)
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/pmiyc
      - name: Test Python reporters
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Detect storage, collector, extraction, and search races
        if: runner.os == 'Linux'
        run: go test -race ./internal/storage ./internal/collector ./internal/extract ./internal/search
